version: "2"

# dev-habits『工具链报错清零』『错误处理按项目约定』『查询参数化』『函数只做一件事』『嵌套限深』『参数收敛』『调试残留清零』『禁魔法值』的 Go 落地。
# 用法：拷入项目根目录；工具版本锁定，不随 CI 静默升级。

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck      # 错误不许丢：对应『错误处理按项目约定』
    - gosec         # 注入、凭证、弱随机扫描：对应『查询参数化』『外部输入不可信』
    - revive        # Go 社区注释与命名规范（golint 后继）：对应『注释写为什么』
    - funlen        # 函数长度：对应『函数只做一件事』
    - gocognit      # 认知复杂度：对应『函数只做一件事』
    - nestif        # 嵌套深度：对应『嵌套限深』
    - forbidigo     # 禁 fmt.Print* 调试残留：对应『调试残留清零』Go 侧
    - mnd           # 魔法数字：对应『禁魔法值』
    - misspell
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: exported          # 导出项必须有文档注释
        - name: package-comments  # 包级注释；老项目可按包 allow 并在注释里写明原因
        - name: var-naming        # 大小写与惯用语初始名
    funlen:
      line-length: 80    # 提醒档：条款提醒约 50 行，机械阈值放宽一档防为拆而拆
      statements: 50
    gocognit:
      min-complexity: 25 # 提醒档，默认 30 再收一点
    nestif:
      min-complexity: 5  # 提醒档：对应『嵌套限深』条款的 2 层
    forbidigo:
      patterns:
        - '^fmt\.Print.*$' # 正式日志走结构化日志，不裸写打印

formatters:
  enable:
    - gofumpt       # gofmt 超集，强制；项目若已统一 plain gofmt 可换 gofmt
